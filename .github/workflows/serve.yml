name: Serve-next

permissions:
  contents: read

on:
  push:
    branches: [never]
    paths:
      - "src/**"
      - "templates/**"
      - "tasks/**"
      - ".github/**"
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: Comma-separated task names to build
        required: false
        type: string
      force:
        description: Force selected tasks to rebuild
        required: false
        default: false
        type: boolean
      weekly:
        description: Run weekly tasks regardless of weekday
        required: false
        default: false
        type: boolean
      verify_cloud139_writeback:
        description: Verify cloud139 Secret writeback even when the config has not changed
        required: false
        default: false
        type: boolean

concurrency:
  group: serve-next-production
  cancel-in-progress: false

jobs:
  serve:
    runs-on: ubuntu-24.04
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # 获取仓库源码
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.ref }}
          persist-credentials: false

      # 安装系统依赖
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y aria2 7zip curl innoextract rclone ca-certificates jq

      # 编译 Linux 原生 PE 版本读取器，避免为 rcedit 引入 Wine 运行时
      - name: Build PE version reader
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cargo build --release --locked --manifest-path scripts/read-pe-version/Cargo.toml --target-dir "$RUNNER_TEMP/read-pe-version-target"
          install -m 755 "$RUNNER_TEMP/read-pe-version-target/release/read-pe-version" "$RUNNER_TEMP/bin/read-pe-version"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # 安装 Nodejs
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      # 启用 pnpm
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.16.0 --activate

      # 获取 pnpm store 路径
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # 缓存 pnpm store
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-

      # 安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 在部署生产凭据前完成代码测试
      - name: Test code
        run: pnpm test

      # 获取并解压 cloud139
      - name: Download and extract cloud139
        uses: robinraju/release-downloader@v1
        with:
          repository: "Cnotech/cloud139"
          latest: true
          fileName: "cloud139-linux-x86_64.tar.gz"
          out-file-path: ./
          extract: true

      # 检查构建工具
      - name: Verify environment
        run: |
          node --version
          pnpm --version
          cargo --version
          aria2c --version
          7z --help
          curl --version
          innoextract --version
          read-pe-version node_modules/rcinfo/bin/ShowVer.exe | grep -Fxq '1.0.0.1'
          rclone version
          ./cloud139 --help

      # 部署远程配置，并记录上次持久化的 cloud139 配置校验和
      - name: Install remote configuration
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          CLOUD139_CONFIG: ${{ secrets.CLOUD139_CONFIG }}
        run: |
          : "${RCLONE_CONF:?Set RCLONE_CONF in the production environment}"
          : "${CLOUD139_CONFIG:?Set CLOUD139_CONFIG in the production environment}"
          if [[ -e ./cloud139rc.toml || -L ./cloud139rc.toml ]]; then
            echo '::error::A workspace cloud139rc.toml would override the production configuration.'
            exit 1
          fi

          umask 077
          install -d -m 700 "$HOME/.config/rclone" "$HOME/.config/cloud139"
          rclone_config="$HOME/.config/rclone/rclone.conf"
          cloud139_config="$HOME/.config/cloud139/cloud139rc.toml"
          printf '%s' "$RCLONE_CONF" > "$rclone_config"
          printf '%s' "$CLOUD139_CONFIG" > "$cloud139_config"
          chmod 600 "$rclone_config" "$cloud139_config"
          sha256sum "$cloud139_config" > "$RUNNER_TEMP/cloud139-config.sha256"
          rclone listremotes | grep -Fxq "kanuo:"

      # 即使没有新包也检查续期。列表请求失败时，仍保存已续期的配置。
      - name: Check cloud139 session
        id: cloud139-check
        env:
          VERIFY_CLOUD139_WRITEBACK: ${{ inputs.verify_cloud139_writeback }}
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=5s 35s ./cloud139 ls / --page-size 1 > /dev/null; then
              status=0
              break
            else
              status=$?
            fi
            echo "::warning::cloud139 session check $attempt/3 failed (exit $status)."
            if (( attempt < 3 )); then sleep "$((attempt * 5))"; fi
          done
          if ! sha256sum --check --status "$RUNNER_TEMP/cloud139-config.sha256" ||
            [[ "$VERIFY_CLOUD139_WRITEBACK" == "true" && "$status" == 0 ]]; then
            echo 'writeback=true' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Diagnose cloud139 network failure
        if: ${{ !cancelled() && steps.cloud139-check.outcome == 'failure' }}
        run: |
          cloud139_host=$(node -e '
            const config = require("toml").parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (!config.personal_cloud_host) process.exit();
            const { protocol, hostname } = new URL(config.personal_cloud_host);
            if (protocol === "https:" && hostname.endsWith(".yun.139.com")) console.log(hostname);
          ' "$HOME/.config/cloud139/cloud139rc.toml") || cloud139_host=
          for host in user-njs.yun.139.com "${cloud139_host:-personal-kd-njs.yun.139.com}"; do
            echo "Checking $host"
            timeout 8s getent ahosts "$host" | awk '{print $1}' | sort -u || true
            curl --silent --show-error --head --output /dev/null \
              --connect-timeout 6 --max-time 10 \
              --write-out 'ip=%{remote_ip} http=%{http_code} dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect}\n' \
              "https://$host/" || true
          done

      - name: Create token for cloud139 writeback before build
        id: cloud139-prebuild-token
        if: ${{ !cancelled() && steps.cloud139-check.outputs.writeback == 'true' }}
        uses: actions/create-github-app-token@v3
        with: &cloud139-app
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-environments: write

      - name: Save cloud139 configuration before build
        if: ${{ !cancelled() && steps.cloud139-prebuild-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.cloud139-prebuild-token.outputs.token }}
        run: &save-cloud139-config |
          cloud139_config="$HOME/.config/cloud139/cloud139rc.toml"
          if [[ ! -s "$cloud139_config" ]]; then
            echo '::error::The cloud139 configuration is missing or empty.'
            exit 1
          fi
          gh secret set CLOUD139_CONFIG --repo "$GITHUB_REPOSITORY" --env production < "$cloud139_config"
          sha256sum "$cloud139_config" > "$RUNNER_TEMP/cloud139-config.sha256"

      # 运行构建任务
      - name: Run scripts
        id: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK_INPUT: ${{ inputs.task }}
          FORCE_INPUT: ${{ inputs.force }}
          WEEKLY_INPUT: ${{ inputs.weekly }}
        run: |
          args=(-g)
          if [[ "$FORCE_INPUT" == "true" ]]; then args+=(-f); fi
          if [[ "$WEEKLY_INPUT" == "true" ]]; then args+=(-w); fi
          if [[ -n "$TASK_INPUT" ]]; then args+=(-t "$TASK_INPUT"); fi
          pnpm serve "${args[@]}"

      # 构建期间也可能续期，构建失败时仍检查是否需要回写。
      - name: Check for cloud139 changes after build
        id: cloud139-postbuild-check
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        run: |
          if ! sha256sum --check --status "$RUNNER_TEMP/cloud139-config.sha256"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Create token for cloud139 writeback after build
        id: cloud139-postbuild-token
        if: ${{ !cancelled() && steps.cloud139-postbuild-check.outputs.changed == 'true' }}
        uses: actions/create-github-app-token@v3
        with: *cloud139-app

      - name: Save cloud139 configuration after build
        if: ${{ !cancelled() && steps.cloud139-postbuild-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.cloud139-postbuild-token.outputs.token }}
        run: *save-cloud139-config
