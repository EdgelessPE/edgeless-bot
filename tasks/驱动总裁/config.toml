#:schema ../../schema/task.json
# 任务基本信息
[task]
name = "驱动总裁"
category = "驱动管理"
author = "Cno"
url = "https://www.sysceo.com/Software-softwarei-id-258.html"

# 指定使用的模板
[template]
scraper = "Global_Page_Match"
# resolver = ""
producer = "Recursive_Unzip"

# 使用到的正则
[regex]
# download_link = ''
download_name = '\.exe'
# scraper_version = ''

# 通用参数
[parameter]
# resolver_cd = []
# compress_level = 5
build_manifest = ["${taskName}.wcs", "${taskName}/DrvCeo.exe"]
# build_cover = ""
# build_delete = []

# 爬虫模板临时参数
[scraper_temp]
# 官网已移除完整安装包直链；PC9 同步页的本地下载仍提供完整 Inno 安装包。
# 只匹配完整包 CDN，避免选中“安全下载”的 360 下载器或网盘链接。
download_page_url = "https://soft.pc9.com/pc/info-479.html"
download_selector = 'a.dl_add_btn[href^="https://cdn-download.soft.360.cn/softmanager-installation/"][href$=".exe"]'
version_selector = "body > div.main > div.contentFrame > div.toolInfo.fl > div > div > div.msg.fl.cl > ol > li:nth-child(2)"

# 自动制作模板要求的参数
[producer_required]
shortcutName = "驱动总裁"
sourceFile = "DrvCeo.exe"
launchArg = "/n"
recursiveUnzipList = ['{app}']
innoSetup = true

# 额外备注
# [extra]
# require_windows = false
# missing_version = ""
