#:schema ../../schema/task.json
# 任务基本信息
[task]
name = "远程看看"
category = "远程连接"
author = "xrgzs"
url = "https://www.anyviewer.cn/download.html"

# 指定使用的模板
[template]
scraper = "External"
# resolver = ""
producer = "Recursive_Unzip"

# 使用到的正则
[regex]
# download_link = ''
download_name = '\.exe'
# scraper_version = ''

# 通用参数
[parameter]
# resolver_cd = []
# compress_level = 5
build_manifest = ["${taskName}.wcs","${taskName}/RCClient.exe"]
# build_cover = ""
# build_delete = []

# 爬虫模板临时参数
# [scraper_temp]

# 自动制作模板要求的参数
[producer_required]
shortcutName = "远程看看"
sourceFile = "RCClient.exe"
recursiveUnzipList = ['{app}']
innoSetup = true

# 额外备注
[extra]
# require_windows = true
missing_version = "${taskName}/RCClient.exe"
# weekly = true
