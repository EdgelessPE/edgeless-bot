#:schema ../../schema/task.json
# 任务基本信息
[task]
name = "华为浏览器"
category = "浏览器"
author = "Cno"
url = "https://consumer.huawei.com/cn/mobileservices/browser/"

# 指定使用的模板
[template]
scraper = "External"
# resolver = ""
producer = "Recursive_Unzip"

# 使用到的正则
[regex]
download_name = '\.exe'

# 通用参数
[parameter]
# resolver_cd = []
# compress_level = 5
build_manifest = ["${taskName}.wcs","${taskName}/HuaweiBrowser.exe"]
# build_cover = ""
# build_delete = []

# 自动制作模板要求的参数
[producer_required]
shortcutName = "华为浏览器"
sourceFile = "HuaweiBrowser.exe"
recursiveUnzipList = [ "$PLUGINSDIR", "app", "chrome-signed.7z", "Chrome-bin" ]


# 额外备注
# [extra]
# require_windows = true
# missing_version = ""
# weekly = true
