#:schema ../../schema/task.json
# 任务基本信息
[task]
name = "WorkBuddy"
category = "办公编辑"
author = "Cno"
url = "https://copilot.tencent.com/work/"

# 指定使用的模板
[template]
scraper = "REST_API"
# resolver = ""
producer = "Silent_Install"

# 使用到的正则
[regex]
# download_link = ''
download_name = '^WorkBuddy-win32-x64-user-[\d.]+-[0-9a-f]+\.exe$'
# scraper_version = ''

# 通用参数
[parameter]
# resolver_cd = []
# compress_level = 1
build_manifest = ["${taskName}.wcs", "${taskName}/${downloadedFile}"]
# build_cover = ""
# build_delete = []

# 爬虫模板临时参数
[scraper_temp]
api_url = "https://copilot.tencent.com/v2/update?platform=workbuddy-win32-x64-user"
version_path = "version"
download_path = "url"
referer = "https://copilot.tencent.com/work/"

# 自动制作模板要求的参数
[producer_required]

# 额外备注
# [extra]
# require_windows = false
# missing_version = ""
# weekly = true
