#:schema ../../schema/task.json
# 任务基本信息
[task]
name = "WinDbg"
category = "开发辅助"
author = "Cno"
url = "https://learn.microsoft.com/en-us/windows/apps/windows-sdk/downloads"

# 指定使用的模板
[template]
scraper = "External"
# resolver = ""
producer = "External"

# 使用到的正则
[regex]
# download_link = ''
download_name = 'X64 Debuggers And Tools-x64_en-us\.msi'
# scraper_version = ''

# 通用参数
[parameter]
# resolver_cd = []
# compress_level = 5
build_manifest = ["${taskName}.wcs", "${taskName}/windbg.exe"]
# build_cover = ""
# build_delete = []

# 爬虫模板临时参数
# [scraper_temp]

# 自动制作模板要求的参数
[producer_required]

# 额外备注
[extra]
require_windows = true
# missing_version = ""

