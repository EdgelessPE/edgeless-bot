name: Serve-next

permissions:
  contents: read

on:
  push:
    branches: [never]
    paths:
      - "src/**"
      - "templates/**"
      - "tasks/**"
      - ".github/**"
  workflow_dispatch:
    inputs:
      task:
        description: Comma-separated task names to build
        required: false
        type: string
      force:
        description: Force selected tasks to rebuild
        required: false
        default: false
        type: boolean

concurrency:
  group: serve-next-production
  cancel-in-progress: false

jobs:
  serve:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # 获取仓库源码
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.ref }}
          persist-credentials: false

      # 安装系统依赖
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y aria2 7zip curl innoextract gcc rclone ca-certificates jq

      # 编译跨平台 PE 版本读取器
      - name: Build PE version reader
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cc -std=c11 -O2 -Wall -Wextra -Werror scripts/read_pe_version.c -o "$RUNNER_TEMP/bin/read-pe-version"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # 安装 Nodejs
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      # 启用 pnpm
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.12.2 --activate

      # 获取 pnpm store 路径
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # 缓存 pnpm store
      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node24-pnpm-

      # 安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 在部署生产凭据前完成代码测试
      - name: Test code
        run: pnpm test

      # 获取私有远程配置
      - uses: actions/checkout@v6
        with:
          repository: Cnotech/rclone
          token: ${{ secrets.RCLONE_TOKEN }}
          path: rclone-config
          persist-credentials: false

      # 部署远程配置
      - name: Install remote configuration
        run: |
          test -f rclone-config/rclone.conf
          test -f rclone-config/config.json
          install -D -m 600 rclone-config/rclone.conf "$HOME/.config/rclone/rclone.conf"
          install -D -m 600 rclone-config/config.json "$HOME/.config/cloud189/config.json"

      # 下载并校验 cloud139
      - name: Install cloud139
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset_name="cloud139-linux-x86_64.tar.gz"
          release_json="$RUNNER_TEMP/cloud139-release.json"
          archive_path="$RUNNER_TEMP/$asset_name"
          extract_dir="$RUNNER_TEMP/cloud139-extracted"
          binary_dir="$RUNNER_TEMP/bin"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Cnotech/cloud139/releases/latest \
            --output "$release_json"
          download_url=$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .browser_download_url' "$release_json")
          expected_digest=$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .digest' "$release_json")
          test -n "$download_url"
          test "$download_url" != "null"
          test -n "$expected_digest"
          test "$expected_digest" != "null"
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            "$download_url" \
            --output "$archive_path"
          actual_digest="sha256:$(sha256sum "$archive_path" | cut -d ' ' -f 1)"
          test "$actual_digest" = "$expected_digest"
          mkdir -p "$extract_dir"
          tar -xzf "$archive_path" -C "$extract_dir"
          cloud139_path=$(find "$extract_dir" -type f -name cloud139 -print -quit)
          test -n "$cloud139_path"
          install -D -m 755 "$cloud139_path" "$binary_dir/cloud139"
          echo "$binary_dir" >> "$GITHUB_PATH"

      # 检查工具、远程配置与代码
      - name: Verify environment
        run: |
          node --version
          pnpm --version
          aria2c --version
          7z --help
          curl --version
          innoextract --version
          read-pe-version node_modules/rcinfo/bin/ShowVer.exe | grep -Fxq '1.0.0.1'
          rclone version
          cloud139 --help
          rclone listremotes | grep -Fxq "kanuo:"

      # 运行构建任务
      - name: Run scripts
        env:
          CLOUD139_TOKEN: ${{ secrets.CLOUD139_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK_INPUT: ${{ inputs.task }}
          FORCE_INPUT: ${{ inputs.force }}
        run: |
          args=(-g)
          if [[ "$FORCE_INPUT" == "true" ]]; then args+=(-f); fi
          if [[ -n "$TASK_INPUT" ]]; then args+=(-t "$TASK_INPUT"); fi
          pnpm serve "${args[@]}"
