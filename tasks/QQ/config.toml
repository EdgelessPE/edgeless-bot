#:schema ../../schema/task.json
# 任务基本信息
[task]
name = "QQ"
category = "即时通讯"
author = "Cno"
url = "https://github.com/ScoopInstaller/Extras/blob/master/bucket/qq-nt.json"

# 指定使用的模板
[template]
scraper = "Scoop"
# resolver = ""
producer = "Recursive_Unzip"

# 使用到的正则
[regex]
download_link = 'https:\/\/dldir1\.qq\.com\/qqfile\/qq/QQNT\/[\w\/.]+_x64([\w_]*)\.exe'
download_name = '\.exe'
# scraper_version = ''

# 通用参数
[parameter]
# resolver_cd = []
# compress_level = 5
build_manifest = ["${taskName}.wcs", "${taskName}/QQ.exe"]
# build_cover = ""
build_delete = ["Uninstall.exe"]

# 爬虫模板临时参数
[scraper_temp]

# 自动制作模板要求的参数
[producer_required]
shortcutName = "QQ"
sourceFile = "QQ.exe"
recursiveUnzipList = ["Files"]

# 额外备注
# [extra]
# require_windows = false
# missing_version = ""
