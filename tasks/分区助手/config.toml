#:schema ../../schema/task.json
# 任务基本信息
[task]
name = "分区助手"
category = "磁盘数据"
author = "Cno"
url = "https://www.disktool.cn/download.html"

# 指定使用的模板
[template]
scraper = "Global_Page_Match"
# resolver = ""
producer = "Recursive_Unzip"

# 使用到的正则
[regex]
# download_link = ''
download_name = '\.7z'
# scraper_version = ''

# 通用参数
[parameter]
# resolver_cd = []
# compress_level = 5
build_manifest = ["${taskName}.wcs","${taskName}/PartAssist.exe"]
# build_cover = ""
# build_delete = []

# 爬虫模板临时参数
[scraper_temp]
version_selector = '.pe li:has(a[href$="/PAWinPEx64.7z"]) .top .title'
download_selector = '.pe a[href$="/PAWinPEx64.7z"]'
referer = "https://www.disktool.cn/download.html"

# 自动制作模板要求的参数
[producer_required]
shortcutName = "分区助手"
sourceFile = "StartPartAssist.exe"
recursiveUnzipList = [ "PAWinPEx64" ]
