#:schema ../../schema/task.json
# 任务基本信息
[task]
name = "DSH Desktop"
category = "集成开发"
author = "Cno"
url = "https://github.com/dataelement/dsh-desktop"

# 指定使用的模板
[template]
# scraper = ""
# resolver = ""
producer = "Silent_Install"

# 使用到的正则
[regex]
# download_link = ''
download_name = '^dsh-desktop-windows-x64-setup\.exe$'
# scraper_version = ''

# 通用参数
[parameter]
# resolver_cd = []
# compress_level = 5
build_manifest = ["${taskName}.wcs", "${taskName}/${downloadedFile}"]
# build_cover = ""
# build_delete = []

# 爬虫模板临时参数
# [scraper_temp]

# 自动制作模板要求的参数
[producer_required]

# 额外备注
# [extra]
# require_windows = true
# missing_version = ""
# weekly = true
