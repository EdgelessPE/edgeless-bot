#:schema ../../schema/task.json
# 任务基本信息
[task]
name = "小小输入法"
category = "输入法"
author = "xrgzs"
url = "https://yongim.ysepan.com/"

# 指定使用的模板
[template]
scraper = "External"
# resolver = ""
producer = "Recursive_Unzip"

# 使用到的正则
[regex]
download_name = '\.7z'

# 通用参数
[parameter]
# resolver_cd = []
# compress_level = 5
build_manifest = ["${taskName}.wcs","${taskName}"]
# build_cover = ""
# build_delete = []

# 自动制作模板要求的参数
[producer_required]
shortcutName = "小小输入法"
sourceFile = "w64\\yong.exe"
recursiveUnzipList = ['yong']


# 额外备注
[extra]
# require_windows = true
# missing_version = ""
weekly = true
